<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#1B1523"/>

  <!-- inter-layer promotion links -->
  <g stroke="#8E8FFA" stroke-opacity="0.35" stroke-width="1.3" stroke-dasharray="3 5">
    <line x1="95" y1="480" x2="95" y2="300"/>
    <line x1="205" y1="480" x2="205" y2="300"/>
    <line x1="315" y1="480" x2="315" y2="300"/>
    <line x1="425" y1="480" x2="425" y2="300"/>
    <line x1="535" y1="480" x2="535" y2="300"/>
    <line x1="645" y1="480" x2="645" y2="300"/>
    <line x1="755" y1="480" x2="755" y2="300"/>
    <line x1="205" y1="300" x2="205" y2="150"/>
    <line x1="425" y1="300" x2="425" y2="150"/>
    <line x1="645" y1="300" x2="645" y2="150"/>
    <line x1="425" y1="150" x2="425" y2="60"/>
  </g>

  <!-- layer 0: dense bottom graph -->
  <g stroke="#F6F4FA" stroke-opacity="0.16" stroke-width="1.4">
    <line x1="40" y1="480" x2="95" y2="480"/>
    <line x1="95" y1="480" x2="150" y2="480"/>
    <line x1="150" y1="480" x2="205" y2="480"/>
    <line x1="205" y1="480" x2="260" y2="480"/>
    <line x1="260" y1="480" x2="315" y2="480"/>
    <line x1="315" y1="480" x2="370" y2="480"/>
    <line x1="370" y1="480" x2="425" y2="480"/>
    <line x1="425" y1="480" x2="480" y2="480"/>
    <line x1="480" y1="480" x2="535" y2="480"/>
    <line x1="535" y1="480" x2="590" y2="480"/>
    <line x1="590" y1="480" x2="645" y2="480"/>
    <line x1="645" y1="480" x2="700" y2="480"/>
    <line x1="700" y1="480" x2="755" y2="480"/>
  </g>
  <g fill="none" stroke="#F6F4FA" stroke-opacity="0.09" stroke-width="1.2">
    <path d="M40,480 Q170,440 315,480"/>
    <path d="M260,480 Q390,440 535,480"/>
    <path d="M480,480 Q610,440 755,480"/>
  </g>

  <!-- layer 1: middle graph -->
  <g stroke="#F6F4FA" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="95" y1="300" x2="205" y2="300"/>
    <line x1="205" y1="300" x2="315" y2="300"/>
    <line x1="315" y1="300" x2="425" y2="300"/>
    <line x1="425" y1="300" x2="535" y2="300"/>
    <line x1="535" y1="300" x2="645" y2="300"/>
    <line x1="645" y1="300" x2="755" y2="300"/>
  </g>
  <path d="M95,300 Q260,255 425,300" fill="none" stroke="#F6F4FA" stroke-opacity="0.1" stroke-width="1.3"/>

  <!-- layer 2: top graph -->
  <g stroke="#F6F4FA" stroke-opacity="0.25" stroke-width="1.6">
    <line x1="205" y1="150" x2="425" y2="150"/>
    <line x1="425" y1="150" x2="645" y2="150"/>
  </g>

  <!-- layer 0 nodes -->
  <g fill="#F3C6D0">
    <circle cx="40" cy="480" r="6"/>
    <circle cx="95" cy="480" r="6"/>
    <circle cx="150" cy="480" r="6"/>
    <circle cx="205" cy="480" r="6"/>
    <circle cx="260" cy="480" r="6"/>
    <circle cx="315" cy="480" r="6"/>
    <circle cx="370" cy="480" r="6"/>
    <circle cx="425" cy="480" r="6"/>
    <circle cx="480" cy="480" r="6"/>
    <circle cx="535" cy="480" r="6"/>
    <circle cx="590" cy="480" r="6"/>
    <circle cx="645" cy="480" r="6"/>
    <circle cx="700" cy="480" r="6"/>
    <circle cx="755" cy="480" r="6"/>
  </g>

  <!-- layer 1 nodes -->
  <g fill="#8E8FFA">
    <circle cx="95" cy="300" r="8"/>
    <circle cx="205" cy="300" r="8"/>
    <circle cx="315" cy="300" r="8"/>
    <circle cx="425" cy="300" r="8"/>
    <circle cx="535" cy="300" r="8"/>
    <circle cx="645" cy="300" r="8"/>
    <circle cx="755" cy="300" r="8"/>
  </g>

  <!-- layer 2 nodes -->
  <g fill="#E8577E">
    <circle cx="205" cy="150" r="9"/>
    <circle cx="425" cy="150" r="9"/>
    <circle cx="645" cy="150" r="9"/>
  </g>

  <!-- entry point -->
  <circle cx="425" cy="60" r="10" fill="#F6F4FA" stroke="#E8577E" stroke-width="2"/>

  <!-- labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F6F4FA" fill-opacity="0.5" letter-spacing="0.5">
    <text x="18" y="484">layer 0</text>
    <text x="18" y="304">layer 1</text>
    <text x="18" y="154">layer 2</text>
    <text x="445" y="56" font-size="12" fill="#E8577E" fill-opacity="0.85">entry</text>
  </g>
</svg>
